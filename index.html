<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cotizador de servicios</title>
<style>
:root{--azul:#0f2447;--dorado:#c9a227;--gris:#f3f5f9;--borde:#d9dee8;--txt:#1b2433;--ok:#1d7a46;--mal:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);background:var(--gris);font-size:15px}
header{background:var(--azul);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--dorado)}
header h1{font-size:17px;margin:0}
nav{display:flex;gap:6px}
nav button{background:transparent;color:#fff;border:1px solid #ffffff55;padding:8px 14px;border-radius:8px;font-size:14px;cursor:pointer}
nav button.on{background:var(--dorado);color:var(--azul);border-color:var(--dorado);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--azul)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12.5px;color:#4a5568;gap:4px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--borde);border-radius:8px;background:#fff;color:var(--txt);width:100%}
textarea{min-height:90px;resize:vertical}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--txt)}
.chk input{width:auto}
.rec{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--borde)}
.rec .qty{width:64px}
small{color:#6b7587}
button.b{background:var(--azul);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px}
button.b.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}
button.b.del{background:#fff;color:var(--mal);border:1px solid var(--mal);padding:6px 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cu{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.cfgrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
@media(max-width:600px){.cfgrow,.cu{grid-template-columns:1fr 1fr}}
.hint{background:#fff8e1;border:1px solid #f0dc9a;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
/* Cotización */
#cot{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:18px}
#cot .top{display:flex;justify-content:space-between;gap:10px;border-bottom:3px solid var(--dorado);padding-bottom:10px;margin-bottom:12px}
#cot h2{margin:0;color:var(--azul);font-size:19px}
#cot table{width:100%;border-collapse:collapse;font-size:13.5px}
#cot th{background:var(--azul);color:#fff;text-align:left;padding:7px}
#cot th.r,#cot td.r{text-align:right}
#cot td{padding:7px;border-bottom:1px solid var(--borde)}
.tot td{font-weight:700;background:#f7f1d9}
.neg{color:var(--ok)}
.sum{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.sum{grid-template-columns:1fr}}
.box{border:1px solid var(--borde);border-radius:10px;padding:10px}
.box h4{margin:0 0 6px;font-size:13px;color:var(--azul)}
.box div{display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0}
.box .big{font-weight:800;font-size:15px;border-top:1px solid var(--borde);margin-top:4px;padding-top:5px}
.ahorro{background:#e8f5ec;border:1px solid #b9dfc6;color:var(--ok);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13.5px}
.cond{font-size:12.5px;color:#3b4557;margin-top:12px}
.cond ul{margin:4px 0 8px 18px;padding:0}
.hide{display:none}
.cfgrow6{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
@media(max-width:600px){.cfgrow6{grid-template-columns:1fr 1fr}}
#mini{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--azul);color:#fff;border-top:2px solid var(--dorado);padding:9px 14px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
#mini b{color:var(--dorado)}
#mini.hide{display:none}
@media(min-width:861px){#mini{display:none}}
@media(max-width:860px){body{padding-bottom:52px}}
#conDoc{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px;line-height:1.5;font-size:14px;max-width:820px;margin:0 auto}
#conDoc h1{font-size:19px;text-align:center;color:var(--azul);margin:0 0 14px}
#conDoc h2{font-size:16px;color:var(--azul);border-bottom:2px solid var(--dorado);padding-bottom:4px;margin:22px 0 10px}
#conDoc h3{font-size:14.5px;margin:16px 0 6px;color:var(--azul)}
#conDoc p{margin:0 0 8px;text-align:justify}
#conDoc table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
#conDoc th{background:var(--azul);color:#fff;text-align:left;padding:6px}
#conDoc td{padding:6px;border-bottom:1px solid var(--borde);vertical-align:top}
#conDoc th.r,#conDoc td.r{text-align:right}
#conDoc tr.tot td{background:#f7f1d9}
#conDoc ul{margin:4px 0 10px 20px;padding:0}
.falta{background:#fff3a8;padding:0 3px;border-radius:3px}
.salto{page-break-after:always}
@media print{
  #vCon .noprint{display:none!important}
  #conDoc{border:0;padding:0;max-width:none;font-size:12px}
  #conDoc h3{page-break-after:avoid}
  .falta{background:none;border-bottom:1px solid #000}
  header,.noprint,#form{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .grid{display:block}
  #cot{border:0;padding:0}
}
</style>
</head>
<body>
<header>
  <h1>Cotizador de servicios · Plano · Leads · Cobranza · Portal</h1>
  <nav class="noprint">
    <button data-act="tab" data-t="cot" class="on">Cotizar</button>
    <button data-act="tab" data-t="cfg">Precios</button>
    <button data-act="tab" data-t="con">Contrato</button>
  </nav>
</header>

<main>
  <!-- VISTA COTIZAR -->
  <section id="vCot">
    <div class="bar noprint">
      <button class="b" data-act="print">Imprimir / guardar PDF</button>
      <button class="b sec" data-act="copy">Copiar texto para WhatsApp</button>
    </div>
    <div class="grid">
      <div id="form"></div>
      <div id="cot"></div>
    </div>
  </section>

  <!-- VISTA CONTRATO -->
  <section id="vCon" class="hide">
    <div class="bar noprint">
      <button class="b" data-act="printcon">Imprimir / guardar PDF</button>
      <button class="b sec" data-act="copycon">Copiar texto del contrato</button>
    </div>
    <div id="conAviso" class="hint noprint" style="margin-bottom:12px"></div>
    <div class="noprint" id="conForm"></div>
    <div id="conDoc"></div>
  </section>

  <!-- VISTA PRECIOS -->
  <section id="vCfg" class="hide">
    <div class="bar">
      <button class="b" data-act="export">Exportar precios (respaldo)</button>
      <button class="b sec" data-act="import">Importar respaldo</button>
      <button class="b del" data-act="reset">Volver a precios iniciales</button>
      <input type="file" id="imp" accept=".json" class="hide">
    </div>
    <div class="hint" style="margin-bottom:12px">Los precios se guardan en <b>este navegador</b>. Usa <b>Exportar</b> para tener un respaldo y poder cargarlo en otra computadora o celular.</div>
    <div id="cfg"></div>
  </section>
</main>
<div id="mini" class="noprint"></div>

<script>
/* ============ PRECIOS INICIALES (puedes cambiarlos desde la pestaña "Precios") ============ */
const DEF = {
  marca: "Tu nombre o marca",
  contacto: "WhatsApp: 9XX XXX XXX",
  ver: 2,
  adelanto: 50,
  permanencia: 12,
  credPct: 50,     /* credicontado: % de la implementación que se paga al inicio */
  credMeses: 12,   /* credicontado: en cuántos meses se paga el resto */
  validez: 15,
  tc: 4,
  igv: 0,
  /* Implementación del plano según N° de lotes = PARTE PLANO + PARTE VISUAL.
     fijo:1 → precio fijo ese tramo; fijo:0 → precio × N° de lotes. Más lotes que el último tramo: se usa el último. */
  planoLotes: [
    { max: 200,  fijo: 1, plano: 350,  visual: 450  },
    { max: 400,  fijo: 0, plano: 1.6,  visual: 2.1  },
    { max: 600,  fijo: 0, plano: 1.45, visual: 1.95 },
    { max: 900,  fijo: 0, plano: 1.3,  visual: 1.82 },
    { max: 1200, fijo: 0, plano: 1.15, visual: 1.72 },
    { max: 1600, fijo: 0, plano: 1.0,  visual: 1.62 },
    { max: 99999, fijo: 0, plano: 0.85, visual: 1.53 }  /* 1601 lotes en adelante */
  ],
  /* Solo la MENSUALIDAD del plano depende de este tamaño (la implementación sale de planoLotes) */
  plano: [
    { id: "peq", nombre: "Pequeño", max: 150,   impl: 650,  mens: 80  },
    { id: "med", nombre: "Mediano", max: 600,   impl: 1300, mens: 100 },
    { id: "gra", nombre: "Grande",  max: 99999, impl: 2600, mens: 120 }
  ],
  leads: { impl: 700, tramos: [
    { nombre: "Hasta 20 asesores", mens: 100 },
    { nombre: "De 21 a 100 asesores", mens: 150 },
    { nombre: "Más de 100 asesores", mens: 200 }
  ]},
  cobranza: { impl: 1000, mens: 170 },
  portal:   { impl: 450,  mens: 65  },
  paq: { plus: { impl: 15, mens: 25 }, completo: { impl: 16, mens: 22 } },
  recargos: [
    { id: "r1", nombre: "Plano sin georreferenciar",            impl: 400, mens: 0 },
    { id: "r2", nombre: "Limpieza de lotes y fondo del plano",  impl: 300, mens: 0 },
    { id: "r3", nombre: "Cotizador con excepciones",            impl: 250, mens: 0 },
    { id: "r4", nombre: "Filtro por etapas",                    impl: 250, mens: 0 },
    { id: "r5", nombre: "Resort / áreas comunes en 3D",         impl: 300, mens: 0 }
  ],
  /* Fotos 360° con GPS: 1 día de trabajo cubre "haDia" hectáreas y "fotosDia" fotos.
     comida y alojamiento son valores de ejemplo: ajústalos en la pestaña Precios. */
  foto: { haDia: 3, fotosDia: 21, precioDia: 700, porHa: 250, resta: 50, comida: 60, alojamiento: 80, subida: 0, mens: 30,
    /* Recorrido: mientras más separados estén los puntos, menos fotos se toman por día */
    niveles: [
      { id: "n1", nombre: "Compacto (puntos cercanos)", fotosDia: 21, extra: 0  },
      { id: "n2", nombre: "Medio (puntos separados)",   fotosDia: 14, extra: 30 },
      { id: "n3", nombre: "Disperso (puntos lejanos)",  fotosDia: 8,  extra: 60 }
    ],
    paquetes: [
      { id: "f1", nombre: "360° Básico",   ha: 3,  fotos: 21, precio: 700,  mens: 30 },
      { id: "f2", nombre: "360° Medio",    ha: 6,  fotos: 42, precio: 1300, mens: 50 },
      { id: "f3", nombre: "360° Completo", ha: 12, fotos: 84, precio: 2500, mens: 80 }
    ] },
  incluye: "Hosting y publicación\nRespaldos\nSoporte por WhatsApp\nCambios menores (textos, precios, estados, usuarios)\nCorrección de fallos",
  noincluye: "Lotes o etapas nuevas\nOtro plano\nMódulos nuevos\nCapacitaciones adicionales"
};

/* ============ ESTADO ============ */
const KEY = "cotizador_servicios_v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.plano) return merge(s);
  } catch (e) {}
  return clone(DEF);
}
function merge(s) {
  const c = Object.assign(clone(DEF), s);
  c.foto = Object.assign(clone(DEF.foto), s.foto || {});
  if (!s.ver || s.ver < 2) { c.permanencia = 12; }  /* migración: permanencia mínima ahora es 12 meses */
  c.ver = 2;
  return c;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }

let cfg = load();
let q = {
  cliente: "", proyecto: "", lotes: 300, tier: "med",
  serv: { plano: true, leads: true, cobranza: true, portal: false },
  leadsTramo: 1, rec: {}, custom: [],
  foto: { on: false, modo: "medida", nivel: "n1", fotos: 0, ha: 3, dias: 0, pasajes: 0, aloj: false, noches: 0, comida: true },
  modalidad: "contado", descExtra: 0, descTipo: "%", descMens: 0, descMensTipo: "%", usd: false, aplicaPaquete: true, notas: ""
};

const fmt = n => {
  const v = q.usd ? n / (cfg.tc || 1) : n;
  return (q.usd ? "US$ " : "S/ ") + v.toLocaleString("es-PE", { minimumFractionDigits: q.usd ? 2 : 0, maximumFractionDigits: q.usd ? 2 : 0 });
};

/* ============ CÁLCULO ============ */
function precioPlano(n) {
  n = +n || 0;
  const rows = [...(cfg.planoLotes || [])].sort((a, b) => a.max - b.max);
  if (n <= 0 || !rows.length) return { total: 0, plano: 0, visual: 0, fila: null };
  const bruto = (r, x) => { const m = r.fijo ? 1 : x; return Math.round(m * r.plano) + Math.round(m * r.visual); };
  const r = rows.find(x => n <= x.max) || rows[rows.length - 1];
  const total = bruto(r, n);
  return { total, fila: r };
}

function calc() {
  const L = [];
  const t = cfg.plano.find(x => x.id === q.tier) || cfg.plano[0];
  if (q.serv.plano) L.push({ c: `Plano interactivo (${+q.lotes || 0} lotes)`, impl: precioPlano(q.lotes).total, mens: t.mens, base: true });
  if (q.serv.leads) {
    const tr = cfg.leads.tramos[q.leadsTramo] || cfg.leads.tramos[0];
    L.push({ c: "Control de leads (" + tr.nombre + ")", impl: cfg.leads.impl, mens: tr.mens, base: true });
  }
  if (q.serv.cobranza) L.push({ c: "Sistema de cobranza", impl: cfg.cobranza.impl, mens: cfg.cobranza.mens, base: true });
  if (q.serv.portal) L.push({ c: "Portal de clientes", impl: cfg.portal.impl, mens: cfg.portal.mens, base: true });

  cfg.recargos.forEach(r => {
    const s = q.rec[r.id];
    if (s && s.on) {
      const n = Math.max(1, +s.qty || 1);
      L.push({ c: r.nombre + (n > 1 ? " ×" + n : ""), impl: r.impl * n, mens: r.mens * n });
    }
  });
  if (q.foto.on) {
    const F = cfg.foto;
    const pk = (F.paquetes || []).find(p => p.id === q.foto.modo);
    const nivs = F.niveles || [];
    const niv = nivs.find(n => n.id === q.foto.nivel) || nivs[0] || { nombre: "", fotosDia: F.fotosDia, extra: 0 };
    const nivBase = nivs[0] || niv;
    const ha = pk ? pk.ha : (+q.foto.ha || 0);
    const fotos = pk ? pk.fotos : (q.foto.fotos > 0 ? +q.foto.fotos : Math.round(ha * F.fotosDia / (F.haDia || 1)));
    const dias = q.foto.dias > 0 ? +q.foto.dias : Math.max(1, Math.ceil(fotos / (niv.fotosDia || 1)));
    const diasBase = Math.max(1, Math.ceil(fotos / (nivBase.fotosDia || 1)));
    const pl = n => n > 1 ? "s" : "";
    /* Precio base: hasta haDia hectáreas = precioDia; más grande = porHa × ha − resta (ej. 250×h − 50). Sin hectáreas: días × precioDia */
    const precioHa = ha > 0 ? (ha <= (+F.haDia || 3) ? +F.precioDia : Math.max(+F.precioDia, (+F.porHa || 0) * ha - (+F.resta || 0))) : dias * F.precioDia;
    L.push({
      c: (pk ? pk.nombre + " · " : "") + `Fotos 360° con GPS verificadas y ubicadas en el plano (${ha > 0 ? ha + " ha · " : ""}${fotos} fotos · ${dias} día${pl(dias)})`,
      impl: pk ? pk.precio : precioHa + fotos * (F.subida || 0),
      mens: pk ? pk.mens : (+F.mens || 0)
    });
    if (pk && dias > diasBase) L.push({ c: `Días adicionales por recorrido (${niv.nombre}) ×${dias - diasBase}`, impl: (dias - diasBase) * F.precioDia, mens: 0 });
    if (+niv.extra > 0) L.push({ c: `Movilidad interna en el terreno (${dias} día${pl(dias)})`, impl: dias * niv.extra, mens: 0 });
    if (+q.foto.pasajes) L.push({ c: "Viáticos: pasajes / movilidad", impl: +q.foto.pasajes, mens: 0 });
    if (q.foto.aloj) {
      const n = q.foto.noches > 0 ? +q.foto.noches : Math.max(dias - 1, 0);
      if (n > 0) L.push({ c: `Alojamiento (${n} noche${pl(n)})`, impl: n * F.alojamiento, mens: 0 });
    }
    if (q.foto.comida) L.push({ c: `Alimentación (${dias} día${pl(dias)})`, impl: dias * F.comida, mens: 0 });
  }
  q.custom.forEach(x => {
    if ((x.c || "").trim() || +x.impl || +x.mens) L.push({ c: x.c || "Otro concepto", impl: +x.impl || 0, mens: +x.mens || 0 });
  });

  const baseImpl = L.filter(x => x.base).reduce((a, x) => a + x.impl, 0);
  const baseMens = L.filter(x => x.base).reduce((a, x) => a + x.mens, 0);
  let pk = null;
  if (q.aplicaPaquete) {
    if (q.serv.plano && q.serv.leads && q.serv.cobranza && q.serv.portal) pk = { n: "Completo", p: cfg.paq.completo };
    else if (q.serv.plano && q.serv.leads && q.serv.cobranza) pk = { n: "Plus", p: cfg.paq.plus };
  }
  const subImpl = L.reduce((a, x) => a + x.impl, 0);
  const subMens = L.reduce((a, x) => a + x.mens, 0);
  const dPkImpl = pk ? baseImpl * pk.p.impl / 100 : 0;
  const dPkMens = pk ? baseMens * pk.p.mens / 100 : 0;
  const baseDesc = subImpl - dPkImpl;
  const dExtra = q.descTipo === "%" ? baseDesc * (+q.descExtra || 0) / 100 : Math.min(+q.descExtra || 0, baseDesc);
  const netImpl = subImpl - dPkImpl - dExtra;
  const baseMensDesc = subMens - dPkMens;
  const dMens = q.descMensTipo === "S/" ? Math.min(+q.descMens || 0, baseMensDesc) : baseMensDesc * (+q.descMens || 0) / 100;
  const netMens = subMens - dPkMens - dMens;
  const igv = +cfg.igv || 0;
  const iImpl = netImpl * igv / 100, iMens = netMens * igv / 100;
  const totImpl = netImpl + iImpl, totMens = netMens + iMens;
  const cred = q.modalidad === "credicontado";
  const credMeses = Math.max(1, Math.round(+cfg.credMeses || 12));
  const adel = totImpl * (cred ? (+cfg.credPct || 0) : (+cfg.adelanto || 0)) / 100;
  const cuota = cred ? (totImpl - adel) / credMeses : 0;
  return { L, pk, subImpl, subMens, dPkImpl, dPkMens, dExtra, dMens, iImpl, iMens, totImpl, totMens, adel, igv, cred, credMeses, cuota };
}

/* ============ COTIZACIÓN (vista previa e impresión) ============ */
function renderQuote() {
  const r = calc();
  const hoy = new Date().toLocaleDateString("es-PE");
  const filas = r.L.length ? r.L.map(x => `<tr><td>${esc(x.c)}</td><td class="r">${x.impl ? fmt(x.impl) : "—"}</td><td class="r">${x.mens ? fmt(x.mens) : "—"}</td></tr>`).join("")
    : `<tr><td colspan="3"><small>Elige al menos un servicio.</small></td></tr>`;
  const ahorroImpl = r.dPkImpl + r.dExtra;
  const ahorroMens = r.dPkMens + r.dMens;
  const ahorroTxt = (ahorroImpl > 0 || ahorroMens > 0)
    ? `<div class="ahorro">Ahorro para el cliente: <b>${fmt(ahorroImpl)}</b> en la implementación${ahorroMens > 0 ? ` y <b>${fmt(ahorroMens)}</b> al mes` : ""}.</div>` : "";
  const li = t => String(t || "").split("\n").filter(x => x.trim()).map(x => `<li>${esc(x)}</li>`).join("");
  $("#cot").innerHTML = `
    <div class="top">
      <div><h2>Propuesta de servicios</h2><small>${esc(cfg.marca)} · ${esc(cfg.contacto)}</small></div>
      <div style="text-align:right"><small>Fecha: ${hoy}<br>Válida por ${esc(cfg.validez)} días</small></div>
    </div>
    <div style="margin-bottom:10px"><b>Cliente:</b> ${esc(q.cliente) || "—"}<br><b>Proyecto:</b> ${esc(q.proyecto) || "—"} ${q.serv.plano ? "· " + esc(q.lotes) + " lotes" : ""}</div>
    <table>
      <tr><th>Concepto</th><th class="r">Implementación (pago único)</th><th class="r">Mensual</th></tr>
      ${filas}
    </table>

function setP(p, v) {
  const k = p.split(".");

}

/* ============ EVENTOS ============ */
function onField(e) {
  const t = e.target;
  if (t.dataset.q) {
    const k = t.dataset.q;
    q[k] = t.type === "checkbox" ? t.checked : (t.dataset.num ? +t.value : t.value);
    if (k === "lotes") autoTier();
    if (k === "usd") renderForm();
    renderQuote();
  } else if (t.dataset.s) {
    q.serv[t.dataset.s] = t.checked;
    renderQuote();
  } else if (t.dataset.rec) {
    const id = t.dataset.rec;
    q.rec[id] = q.rec[id] || { on: false, qty: 1 };
    if (t.dataset.k === "on") q.rec[id].on = t.checked; else q.rec[id].qty = +t.value || 1;
    renderQuote();
  } else if (t.dataset.ft) {
    const k = t.dataset.ft;
    q.foto[k] = t.type === "checkbox" ? t.checked : ((k === "modo" || k === "nivel") ? t.value : (+t.value || 0));
    if (k === "modo") renderForm();
    renderQuote();
  } else if (t.dataset.cu !== undefined) {
    q.custom[+t.dataset.cu][t.dataset.f] = t.dataset.f === "c" ? t.value : (+t.value || 0);
    renderQuote();
  }
}
document.addEventListener("input", onField);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.p) {
    const isNum = t.type === "number";
    setP(t.dataset.p, isNum ? (parseFloat(t.value) || 0) : t.value);
    save(); renderForm(); renderQuote();
  } else if (t.id === "imp") {
    const file = t.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d.plano) throw 0;
        cfg = merge(d); save();
        renderConfig(); renderForm(); renderQuote();
        alert("Precios importados.");
      } catch (x) { alert("Ese archivo no es un respaldo válido."); }
    };
    rd.readAsText(file); t.value = "";
  } else onField(e);
});

function textoWA() {
  const r = calc();
  let s = `*Propuesta de servicios*\nCliente: ${q.cliente || "—"}\nProyecto: ${q.proyecto || "—"}\n\n`;
  r.L.forEach(x => { s += `• ${x.c}: ${x.impl ? fmt(x.impl) : "—"}${x.mens ? " + " + fmt(x.mens) + "/mes" : ""}\n`; });
  if (r.dPkImpl > 0) s += `\nDescuento paquete ${r.pk.n}: -${fmt(r.dPkImpl)}`;
  if (r.dExtra > 0) s += `\nDescuento comercial: -${fmt(r.dExtra)}`;
  s += `\n*Implementación: ${fmt(r.totImpl)}*` + (r.cred ? ` (credicontado: inicial ${cfg.credPct}% = ${fmt(r.adel)} + ${r.credMeses} cuotas de ${fmt(r.cuota)})` : ` (contado: adelanto ${cfg.adelanto}%: ${fmt(r.adel)})`);
  s += `\n*Mensualidad: ${fmt(r.totMens)}* (mínimo ${cfg.permanencia} meses)`;
  s += `\n\nVálida por ${cfg.validez} días.\n${cfg.marca} · ${cfg.contacto}`;
  return s;
}

document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  con[k] = e.target.type === "number" ? (e.target.value === "" ? "" : +e.target.value) : e.target.value;
  saveCon(); renderContrato();
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "tab") {
    const t = b.dataset.t, cot = t === "cot";
    $("#vCot").classList.toggle("hide", !cot);
    $("#vCfg").classList.toggle("hide", t !== "cfg");
    $("#vCon").classList.toggle("hide", t !== "con");
    $("#mini").classList.toggle("hide", !cot);
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
    if (cot) { renderForm(); renderQuote(); }
    if (t === "con") { renderConForm(); renderContrato(); }
  } else if (a === "print" || a === "printcon") window.print();
  else if (a === "copycon") {
    const t = $("#conDoc").innerText;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert("Contrato copiado."))
      .catch(() => { prompt("Copia este texto:", t); });
  } else if (a === "copy") {
    const t = textoWA();
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert("Texto copiado. Pégalo en WhatsApp."))
      .catch(() => { prompt("Copia este texto:", t); });
  } else if (a === "addcu") { q.custom.push({ c: "", impl: 0, mens: 0 }); renderCust(); }
  else if (a === "delcu") { q.custom.splice(+b.dataset.i, 1); renderCust(); renderQuote(); }
  else if (a === "addrec") { cfg.recargos.push({ id: "r" + Date.now(), nombre: "Nuevo concepto", impl: 0, mens: 0 }); save(); renderConfig(); }
  else if (a === "addpk") { cfg.foto.paquetes.push({ id: "f" + Date.now(), nombre: "Nuevo paquete", ha: 0, fotos: 0, precio: 0, mens: 0 }); save(); renderConfig(); }
  else if (a === "delpk") {
    if (confirm("¿Quitar este paquete?")) { const p = cfg.foto.paquetes.splice(+b.dataset.i, 1)[0]; if (p && q.foto.modo === p.id) q.foto.modo = "medida"; save(); renderConfig(); }
  } else if (a === "delrec") {
    if (confirm("¿Quitar este recargo?")) { cfg.recargos.splice(+b.dataset.i, 1); save(); renderConfig(); }
  } else if (a === "export") {
    const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: "application/json" });
    const l = document.createElement("a");
    l.href = URL.createObjectURL(blob);
    l.download = "precios_cotizador_" + new Date().toISOString().slice(0, 10) + ".json";
    l.click(); URL.revokeObjectURL(l.href);
  } else if (a === "import") $("#imp").click();
  else if (a === "reset") {
    if (confirm("¿Volver a los precios iniciales? Se perderán los cambios (exporta antes si quieres respaldo).")) {
      cfg = clone(DEF); save(); renderConfig(); renderForm(); renderQuote();
    }
  }
});

    `<label>${esc(c[1])}<input data-k="${c[0]}" type="${c[2] || "text"}" value="${esc(con[c[0]])}"></label>`).join("")}</div></div>`).join("")
    + `<div class="hint">Los datos del Cliente, el proyecto, los precios y la modalidad de pago salen de la pestaña <b>Cotizar</b>. Lo que falte aparece resaltado en amarillo entre corchetes.</div>`;
}

function renderContrato() {
  const r = calc();
  const m = fmt;
  const v = (x, ph) => String(x ?? "").trim() ? `<b>${esc(x)}</b>` : `<span class="falta">[${esc(ph)}]</span>`;
  const n = x => `<b>${esc(x)}</b>`;
  const hoy = new Date().toLocaleDateString("es-PE", { day: "numeric", month: "long", year: "numeric" });
  const perm = +cfg.permanencia || 12;
  const cred = r.cred;
  const saldoImpl = r.totImpl - r.adel;
  const S = [];
  const H = t => S.push(`<h3>${t}</h3>`);
  const P = t => S.push(`<p>${t}</p>`);
  const T = t => S.push(`<h2>${t}</h2>`);

  S.push(`<h1>Contrato de servicios tecnológicos y mantenimiento mensual</h1>`);
  P(`Conste por el presente documento el contrato de prestación de servicios tecnológicos y mantenimiento mensual (el "Contrato") que celebran:`);
  P(`<b>EL PRESTADOR:</b> ${v(con.pNombre, "NOMBRE COMPLETO")}, identificado con DNI N.º ${v(con.pDni, "DNI")} y RUC N.º ${v(con.pRuc, "RUC")}, con domicilio en ${v(con.pDom, "DOMICILIO Y CIUDAD")}, correo electrónico ${v(con.pCorreo, "CORREO")} y WhatsApp ${v(con.pWsp, "NÚMERO")}.`);
  P(`<b>EL CLIENTE:</b> ${v(con.cRazon || q.cliente, "RAZÓN SOCIAL")}, con RUC N.º ${v(con.cRuc, "RUC")}, con domicilio en ${v(con.cDom, "DOMICILIO")}, representada por ${v(con.cRep, "REPRESENTANTE")}, identificado con DNI N.º ${v(con.cDni, "DNI")}, con poder inscrito en la Partida Electrónica N.º ${v(con.cPartida, "N.º")}, correo electrónico ${v(con.cCorreo, "CORREO")} y WhatsApp ${v(con.cWsp, "NÚMERO")}.`);

  H("Cláusula 1. Antecedentes y negociación individual");
  P(`1.1 El Prestador desarrolla y opera plataformas digitales para proyectos inmobiliarios: visor interactivo de lotes con plano, control de leads, cobranza, portal de clientes y registro fotográfico 360° con ubicación GPS.`);
  P(`1.2 El Cliente desarrolla el proyecto inmobiliario ${v(q.proyecto, "NOMBRE DEL PROYECTO")}, ubicado en ${v(con.ubic, "UBICACIÓN")} (el "Proyecto"), y desea contratar los servicios descritos en el Anexo A.`);
  P(`1.3 Las partes declaran que este Contrato y sus anexos fueron negociados y acordados individualmente: el Cliente los leyó completos, pudo proponer cambios, los consultó con quien consideró necesario y los acepta conociendo su alcance. No es un contrato de adhesión ni se basa en cláusulas generales de contratación.`);

  H("Cláusula 2. Objeto y licencia de uso");
  P(`2.1 El Prestador prestará al Cliente los servicios indicados en el Anexo A: (a) la implementación inicial de las plataformas contratadas y (b) el acceso y mantenimiento mensual de las mismas.`);
  P(`2.2 Las plataformas se brindan como servicio: el Cliente recibe una licencia de uso no exclusiva, intransferible y temporal, vigente mientras el Contrato esté vigente y los pagos estén al día. El Cliente no adquiere la propiedad del sistema ni tiene derecho a recibir el código fuente.`);

  H("Cláusula 3. Precio, forma de pago y comprobantes");
  if (cred) {
    P(`3.1 <b>Implementación (credicontado).</b> El precio de la implementación es ${n(m(r.totImpl))}. El Cliente lo pagará así: (a) una cuota inicial de ${n(cfg.credPct + "%")} (${n(m(r.adel))}) antes de iniciar el trabajo; y (b) el saldo de ${n(m(r.totImpl - r.adel))} en ${n(r.credMeses)} cuotas mensuales y consecutivas de ${n(m(r.cuota))} cada una, que vencen el día ${v(con.diaPago, "DÍA")} de cada mes, desde el mes siguiente a la cuota inicial. El fraccionamiento no genera intereses mientras cada cuota se pague puntualmente. Sin la cuota inicial y sin los materiales completos del Anexo B no se inicia el trabajo ni corre plazo alguno.`);
    P(`3.1-A <b>Cuotas independientes y vencimiento anticipado.</b> Las cuotas de implementación son independientes de la mensualidad: no se reducen ni se suspenden porque el Cliente termine o suspenda la mensualidad. Si el Cliente se atrasa más de ${v(con.diasMora, "DÍAS")} días calendario en el pago de una cuota, o termina el Contrato por su decisión (salvo por el ajuste de precios de la cláusula 3.5 o por incumplimiento del Prestador), el saldo pendiente de la implementación vence de inmediato y es exigible en su totalidad.`);
  } else {
    P(`3.1 <b>Implementación (contado).</b> El precio de la implementación es ${n(m(r.totImpl))}. El Cliente pagará el ${n(cfg.adelanto + "%")} (${n(m(r.adel))}) como adelanto antes de iniciar y el saldo de ${n(m(saldoImpl))} cuando se publique la versión para revisión. Sin el adelanto y sin los materiales completos del Anexo B no se inicia el trabajo ni corre plazo alguno.`);
  }
  P(`3.2 <b>Mensualidad.</b> El Cliente pagará por adelantado la mensualidad de ${n(m(r.totMens))}, a más tardar el día ${v(con.diaPago, "DÍA")} de cada mes, desde ${v(con.inicioMens, "FECHA DE INICIO")}.`);
  P(`3.3 <b>Medios de pago.</b> Transferencia bancaria, Yape o Plin a las cuentas que el Prestador comunique por escrito. Un pago se considera recibido cuando se acredita en la cuenta del Prestador.`);
  P(`3.4 <b>Comprobante.</b> El Prestador emitirá un recibo por honorarios electrónico por cada pago recibido. El monto del recibo es el precio pactado; si la ley obliga al Cliente a retener el impuesto a la renta, la retención se descuenta de ese monto y el Cliente entregará al Prestador la constancia correspondiente dentro del plazo legal.`);
  P(`3.5 <b>Ajuste de precios.</b> El Prestador podrá ajustar la mensualidad con aviso escrito de 30 días. Si el Cliente no acepta el ajuste, podrá terminar el Contrato dentro de esos 30 días, sin penalidad, pagando hasta la fecha de término.`);
  P(`3.6 <b>Adelanto.</b> ${cred ? "La cuota inicial" : "El adelanto"} de implementación no es reembolsable, porque retribuye el trabajo iniciado y la reserva de agenda del Prestador, salvo que el Prestador no entregue la implementación por causa que le sea imputable.`);

  H("Cláusula 4. Plazo y permanencia");
  P(`4.1 <b>Implementación.</b> El plazo estimado es de ${v(con.plazoImpl, "DÍAS")} días hábiles, contados desde que el Prestador recibe ${cred ? "la cuota inicial" : "el adelanto"} y todos los materiales del Anexo B completos y correctos. Los retrasos del Cliente amplían el plazo en igual medida y no generan penalidad alguna contra el Prestador.`);
  P(`4.2 <b>Mensualidad.</b> Comienza en la fecha indicada en el Anexo A y tiene plazo indeterminado, con una permanencia mínima de ${n(perm)} meses. Cumplida la permanencia, cualquiera de las partes puede terminar el Contrato con aviso escrito de 30 días. El Contrato no se renueva tácitamente: continúa por plazo indeterminado hasta que una parte lo termine.`);
  P(`4.3 <b>Terminación anticipada por el Cliente.</b> Si el Cliente termina el Contrato antes de cumplir la permanencia, pagará una penalidad equivalente al ${v(con.penalidad, "%")}% de las mensualidades que falten para completarla. Las partes reconocen que esta penalidad compensa la inversión de tiempo y configuración que el Prestador hace al inicio.`);
  P(`4.4 <b>Terminación por el Prestador.</b> El Prestador puede terminar el Contrato en cualquier momento con aviso escrito de 30 días. Si lo hace durante la permanencia por una causa que no sea incumplimiento del Cliente, no cobrará mensualidades posteriores a la fecha de término.`);

  H("Cláusula 5. Mora, suspensión y cobranza");
  P(`5.1 Si un pago se retrasa más de ${v(con.diasMora, "DÍAS")} días calendario, el Prestador puede suspender el acceso a las plataformas hasta que el Cliente pague lo adeudado, sin responsabilidad por los perjuicios de la suspensión. Durante la suspensión conserva los datos del Cliente por ${v(con.diasConserva, "DÍAS")} días.`);
  P(`5.2 Las sumas impagas generan intereses moratorios a la tasa de interés legal efectiva, desde el día siguiente al vencimiento hasta el pago total.`);
  P(`5.3 Si el retraso supera los ${v(con.diasResol, "DÍAS")} días calendario, el Prestador puede resolver el Contrato de pleno derecho, comunicándolo por escrito, conforme al artículo 1430 del Código Civil. El Cliente deberá pagar lo adeudado${cred ? " (incluido el saldo de las cuotas de implementación)" : ""} y, si estaba dentro de la permanencia, la penalidad de la cláusula 4.3.`);
  P(`5.4 Los gastos de cobranza extrajudicial y judicial, incluidas costas y costos del proceso, corren por cuenta del Cliente.`);

  H("Cláusula 6. Terminación y sus efectos");
  P(`6.1 Cualquiera de las partes puede resolver el Contrato por incumplimiento grave de la otra, si la requirió por escrito para que lo corrija y no lo hizo en 10 días calendario.`);
  P(`6.2 El Prestador puede resolver el Contrato de inmediato, con aviso escrito, si el Cliente usa las plataformas con fines ilícitos o contrarios a la normativa de venta de inmuebles, comparte sus claves con terceros ajenos, intenta copiar, descompilar o revender el sistema, o lo daña.`);
  P(`6.3 Al terminar el Contrato cesa el acceso a las plataformas. Si el Cliente está al día en sus pagos, el Prestador le entregará, a su solicitud y en 15 días hábiles, una exportación de sus datos en Excel o CSV. El Prestador conservará respaldos por ${v(con.diasConserva, "DÍAS")} días y luego podrá eliminarlos.`);
  P(`6.4 Subsisten después de terminado el Contrato: las obligaciones de pago pendientes${cred ? " (incluidas las cuotas de implementación)" : ""}, la propiedad intelectual, la confidencialidad y la limitación de responsabilidad.`);

  H("Cláusula 7. Alcance del servicio y soporte");
  P(`7.1 La mensualidad incluye únicamente lo indicado en el Anexo B. Todo lo demás es adicional.`);
  P(`7.2 El soporte se brinda por WhatsApp y correo, de lunes a viernes de ${v(con.horario, "HORARIO")}, con un tiempo de respuesta objetivo de ${v(con.horasResp, "HORAS")} horas hábiles. Es un objetivo, no una garantía.`);
  P(`7.3 Los cambios menores (textos, precios, estados de lotes, usuarios, logos) están incluidos hasta ${v(con.cambiosMes, "N")} solicitudes por mes.`);
  P(`7.4 Todo trabajo fuera del Anexo B (lotes o etapas nuevas, otro plano, módulos nuevos, rediseños, capacitaciones adicionales) se cotiza aparte y requiere la aprobación escrita del Cliente, que puede darse por correo o WhatsApp, antes de comenzar.`);

  H("Cláusula 8. Obligaciones del Cliente");
  P(`8.1 Entregar los materiales del Anexo B completos, correctos y a tiempo.`);
  P(`8.2 Garantizar que la información que entrega o carga (planos, áreas, linderos, precios, estados de lotes, condiciones de venta y publicidad) es veraz y está actualizada, y que tiene derecho a usarla y publicarla. El Cliente es el único responsable de esa información y de la legalidad de su Proyecto, incluida la normativa de protección al consumidor y de venta de inmuebles.`);
  P(`8.3 Designar un responsable de coordinación. Sus instrucciones por escrito obligan al Cliente.`);
  P(`8.4 Administrar sus usuarios y claves, no compartirlas y responder por lo que se haga con ellas. Avisar de inmediato si sospecha de un acceso indebido.`);
  P(`8.5 No copiar, descompilar, revender, sublicenciar ni ceder el uso de las plataformas, ni usarlas para proyectos de terceros.`);
  P(`8.6 Revisar cada entrega dentro de ${v(con.diasRevision, "DÍAS")} días hábiles. Vencido ese plazo sin observaciones por escrito, la entrega se considera aceptada.`);

  H("Cláusula 9. Propiedad intelectual");
  P(`9.1 El código, diseño, estructura, plantillas, documentación y mejoras de las plataformas, incluso las hechas a pedido del Cliente, pertenecen al Prestador. Este Contrato no transfiere esos derechos.`);
  P(`9.2 El Cliente conserva la titularidad de sus datos, planos, logos, fotos y contenidos, y autoriza al Prestador a usarlos para prestar el servicio.`);
  P(`9.3 Las fotografías 360° tomadas por el Prestador se publican en el visor del Proyecto. El Cliente puede usarlas para promocionar el Proyecto; el Prestador conserva su autoría y los archivos originales.`);
  P(`9.4 El Prestador puede mencionar el Proyecto y mostrar capturas del visor como referencia comercial, sin datos personales ni información confidencial de compradores, salvo que el Cliente lo prohíba por escrito.`);

  H("Cláusula 10. Datos personales y confidencialidad");
  P(`10.1 El Cliente es titular y responsable del banco de datos de sus leads, compradores y clientes, conforme a la Ley N.º 29733, Ley de Protección de Datos Personales, y su reglamento. Garantiza que cuenta con el consentimiento y la finalidad legal para cargar esos datos en las plataformas, y que informará a sus titulares sobre su tratamiento.`);
  P(`10.2 El Prestador actúa como encargado del tratamiento: usa los datos solo para prestar el servicio y bajo instrucciones del Cliente, aplica medidas de seguridad razonables y no los usa para fines propios. Solo los comparte con los proveedores tecnológicos necesarios para operar las plataformas (por ejemplo, alojamiento y hojas de cálculo en la nube).`);
  P(`10.3 El Prestador avisará al Cliente, en un plazo razonable, de cualquier incidente de seguridad que afecte sus datos.`);
  P(`10.4 Cada parte mantendrá en reserva la información confidencial de la otra durante el Contrato y ${v(con.anosConf, "N")} años después, y no la usará para otro fin. No es confidencial la información pública ni la que deba revelarse por mandato de autoridad.`);

  H("Cláusula 11. Fotos 360° y trabajo de campo");
  if (q.foto.on) {
    P(`11.1 Los viáticos del trabajo de campo (pasajes, movilidad, alojamiento y alimentación) son por cuenta del Cliente, según lo indicado en el Anexo A o en una cotización aprobada.`);
    P(`11.2 El Cliente garantiza el acceso al terreno en condiciones de seguridad y las autorizaciones necesarias. Si por clima, falta de acceso, seguridad u otra causa ajena al Prestador no se puede trabajar, el día se reprograma sin cobrar de nuevo el servicio, pero los gastos ya incurridos corren por cuenta del Cliente.`);
    P(`11.3 Los días de trabajo se calculan según las fotos solicitadas y el recorrido indicados en el Anexo A. Si el trabajo real resulta más extenso por cambios pedidos por el Cliente (puntos, accesos o cantidad de fotos), se cobran los días adicionales a la tarifa del Anexo A.`);
    P(`11.4 La ubicación GPS de las fotos es referencial: su precisión depende del dispositivo y de las condiciones del lugar. Las fotos no constituyen levantamiento topográfico ni sustituyen planos o documentos oficiales.`);
  } else P(`<i>No aplica: este Contrato no incluye fotos 360°.</i>`);

  H("Cláusula 12. Disponibilidad y limitación de responsabilidad");
  P(`12.1 Las plataformas dependen de servicios de terceros (como Google, Cloudflare, GitHub y proveedores de mapas). Las interrupciones o cambios de esos terceros no son incumplimiento del Prestador, quien procurará restablecer el servicio con diligencia razonable. No se garantiza disponibilidad ininterrumpida.`);
  P(`12.2 El plano, las áreas, linderos, estados, precios y cotizaciones que muestran las plataformas son informativos y se basan en la información entregada por el Cliente. No son plano oficial ni título de propiedad. El Cliente debe verificarlos contra sus documentos oficiales antes de cotizar, vender o firmar contratos con sus compradores.`);
  P(`12.3 El sistema de cobranza es una herramienta de registro: no reemplaza la contabilidad ni la asesoría legal o tributaria. El Cliente es responsable de la exactitud de los contratos, cronogramas, intereses y pagos que registre, y de su relación con sus compradores. El Prestador no es parte de esas ventas.`);
  P(`12.4 Salvo dolo o culpa inexcusable, la responsabilidad total del Prestador frente al Cliente, por cualquier causa, se limita al monto de las mensualidades efectivamente pagadas en los ${v(con.mesesLimite, "N")} meses anteriores al hecho. El Prestador no responde por lucro cesante, pérdida de ventas o de clientes, daño a la imagen ni otros daños indirectos.`);
  P(`12.5 Ninguna parte responde por caso fortuito o fuerza mayor.`);

  H("Cláusula 13. Cesión y subcontratación");
  P(`13.1 El Prestador puede subcontratar parte del servicio y ceder sus derechos de cobro a terceros, avisando al Cliente.`);
  P(`13.2 El Cliente no puede ceder su posición ni sus derechos en este Contrato sin autorización escrita del Prestador.`);

  H("Cláusula 14. Comunicaciones");
  P(`14.1 Los avisos operativos y de cobranza son válidos por correo electrónico o WhatsApp, a los datos indicados en la comparecencia. La resolución, la terminación y los cambios de precio se comunican por correo electrónico con confirmación de recepción o por carta.`);
  P(`14.2 Cada parte debe avisar por escrito cualquier cambio de sus datos. Mientras no lo haga, son válidas las comunicaciones enviadas a los datos anteriores.`);

  H("Cláusula 15. Ley aplicable y solución de controversias");
  P(`15.1 Este Contrato se rige por las leyes del Perú.`);
  P(`15.2 Las controversias se tratan primero de forma directa durante 15 días calendario desde que una parte las comunica por escrito.`);
  P(`15.3 Si no se resuelven, se acudirá a conciliación extrajudicial cuando la ley lo exija y luego a los jueces y tribunales del distrito judicial de ${v(con.ciudad, "CIUDAD DEL PRESTADOR")}, a cuya competencia se someten las partes, renunciando al fuero de sus domicilios.`);

  H("Cláusula 16. Disposiciones finales");
  P(`16.1 Los anexos forman parte de este Contrato.`);
  P(`16.2 Toda modificación debe constar por escrito firmado por ambas partes, o por correo electrónico aceptado expresamente por la otra parte.`);
  P(`16.3 Si alguna cláusula resulta inválida, las demás siguen vigentes.`);
  P(`16.4 Que una parte no exija un derecho no significa que renuncie a él.`);
  P(`16.5 El Contrato puede firmarse en copias o con firma digital, y todas tienen el mismo valor.`);

  T("Firmas");
  P(`Las partes firman en señal de conformidad, en ${v(con.ciudad, "CIUDAD")}, el ${esc(hoy)}.`);
  S.push(`<table class="firmas"><tr><th>EL PRESTADOR</th><th>EL CLIENTE</th></tr>
    <tr><td><br><br>Firma: ____________________</td><td><br><br>Firma: ____________________</td></tr>
    <tr><td>${v(con.pNombre, "NOMBRE COMPLETO")}</td><td>${v(con.cRep, "REPRESENTANTE")}</td></tr>
    <tr><td>DNI N.º ${v(con.pDni, "DNI")}</td><td>DNI N.º ${v(con.cDni, "DNI")}</td></tr>
    <tr><td>RUC N.º ${v(con.pRuc, "RUC")}</td><td>${v(con.cRazon || q.cliente, "RAZÓN SOCIAL")}, RUC N.º ${v(con.cRuc, "RUC")}</td></tr></table>`);

  S.push(`<div class="salto"></div>`);
  T("Anexo A. Servicios, precios y condiciones");
  const filas = r.L.map(x => `<tr><td>${esc(x.c)}</td><td class="r">${x.impl ? m(x.impl) : "—"}</td><td class="r">${x.mens ? m(x.mens) : "—"}</td></tr>`).join("");
  const dsc = [];
  if (r.dPkImpl > 0 || r.dPkMens > 0) dsc.push(`<tr><td>Descuento paquete ${esc(r.pk.n)}</td><td class="r">− ${m(r.dPkImpl)}</td><td class="r">− ${m(r.dPkMens)}</td></tr>`);
  if (r.dExtra > 0 || r.dMens > 0) dsc.push(`<tr><td>Descuento comercial</td><td class="r">− ${m(r.dExtra)}</td><td class="r">− ${m(r.dMens)}</td></tr>`);
  if (r.igv > 0) dsc.push(`<tr><td>IGV (${r.igv}%)</td><td class="r">${m(r.iImpl)}</td><td class="r">${m(r.iMens)}</td></tr>`);
  S.push(`<table class="anexo"><tr><th>Servicio</th><th class="r">Implementación</th><th class="r">Mensualidad</th></tr>${filas}${dsc.join("")}
    <tr class="tot"><td><b>Total</b></td><td class="r"><b>${m(r.totImpl)}</b></td><td class="r"><b>${m(r.totMens)}</b></td></tr></table>`);
  P(`<b>Condiciones de este anexo</b>`);
  const li = [];
  li.push(`Modalidad de pago de la implementación: <b>${cred ? "credicontado" : "contado"}</b>.`);
  if (cred) {
    li.push(`Cuota inicial (${cfg.credPct}%): ${n(m(r.adel))}, antes de iniciar.`);
    li.push(`Saldo: ${n(r.credMeses)} cuotas mensuales de ${n(m(r.cuota))}, el día ${v(con.diaPago, "DÍA")} de cada mes.`);
    li.push(`Durante los primeros ${r.credMeses} meses el Cliente paga la cuota más la mensualidad: ${n(m(r.cuota + r.totMens))} al mes.`);
  } else {
    li.push(`Adelanto (${cfg.adelanto}%): ${n(m(r.adel))}, antes de iniciar. Saldo de ${n(m(saldoImpl))} al publicarse la versión para revisión.`);
  }
  li.push(`Fecha de inicio de la mensualidad: ${v(con.inicioMens, "FECHA")}.`);
  li.push(`Día de pago de la mensualidad: ${v(con.diaPago, "DÍA")} de cada mes.`);
  li.push(`Permanencia mínima: ${n(perm)} meses.`);
  li.push(`Cuentas de pago: las comunicará el Prestador por escrito.`);
  if (q.notas.trim()) li.push(`Notas: ${esc(q.notas)}`);
  S.push(`<ul>${li.map(x => `<li>${x}</li>`).join("")}</ul>`);

  T("Anexo B. Alcance de la mensualidad y materiales del Cliente");
  const lst = t => `<ul>${String(t || "").split("\n").filter(x => x.trim()).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  P(`<b>La mensualidad incluye</b>`); S.push(lst(cfg.incluye));
  P(`<b>La mensualidad no incluye (se cotiza aparte)</b>`); S.push(lst(cfg.noincluye));
  P(`<b>Materiales que entrega el Cliente (según los servicios contratados)</b>`);
  S.push(lst("Plano del proyecto (KML/KMZ, DWG/DXF, o PDF o imagen) con los lotes numerados.\nHoja de cálculo con lotes, estados y precios.\nLogos y colores de marca.\nDatos de contacto y WhatsApp para mostrar en el visor.\nDocumentación del proyecto y enlaces que deban incluirse.\nNombre y datos del responsable de coordinación."));

  $("#conDoc").innerHTML = S.join("");
  const faltan = $("#conDoc").querySelectorAll(".falta").length;
  $("#conAviso").innerHTML = faltan ? `Faltan <b>${faltan}</b> datos (resaltados en amarillo). Complétalos arriba antes de imprimir.` : `Contrato completo. Léelo y, si todo está bien, imprímelo o guárdalo en PDF.`;
}

/* ============ INICIO ============ */
autoTier();
renderConfig();
renderForm();
renderQuote();
</script>
</body>
