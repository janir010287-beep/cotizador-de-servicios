<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cotizador de servicios</title>
<style>
:root{--azul:#0f2447;--dorado:#c9a227;--gris:#f3f5f9;--borde:#d9dee8;--txt:#1b2433;--ok:#1d7a46;--mal:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);background:var(--gris);font-size:15px}
header{background:var(--azul);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--dorado)}
header h1{font-size:17px;margin:0}
nav{display:flex;gap:6px}
nav button{background:transparent;color:#fff;border:1px solid #ffffff55;padding:8px 14px;border-radius:8px;font-size:14px;cursor:pointer}
nav button.on{background:var(--dorado);color:var(--azul);border-color:var(--dorado);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--azul)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12.5px;color:#4a5568;gap:4px}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--borde);border-radius:8px;background:#fff;color:var(--txt);width:100%}
textarea{min-height:90px;resize:vertical}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--txt)}
.chk input{width:auto}
.rec{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--borde)}
.rec .qty{width:64px}
small{color:#6b7587}
button.b{background:var(--azul);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px}
button.b.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}
button.b.del{background:#fff;color:var(--mal);border:1px solid var(--mal);padding:6px 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cu{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.cfgrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
@media(max-width:600px){.cfgrow,.cu{grid-template-columns:1fr 1fr}}
.hint{background:#fff8e1;border:1px solid #f0dc9a;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
/* Cotización */
#cot{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:18px}
#cot .top{display:flex;justify-content:space-between;gap:10px;border-bottom:3px solid var(--dorado);padding-bottom:10px;margin-bottom:12px}
#cot h2{margin:0;color:var(--azul);font-size:19px}
#cot table{width:100%;border-collapse:collapse;font-size:13.5px}
#cot th{background:var(--azul);color:#fff;text-align:left;padding:7px}
#cot th.r,#cot td.r{text-align:right}
#cot td{padding:7px;border-bottom:1px solid var(--borde)}
.tot td{font-weight:700;background:#f7f1d9}
.neg{color:var(--ok)}
.sum{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.sum{grid-template-columns:1fr}}
.box{border:1px solid var(--borde);border-radius:10px;padding:10px}
.box h4{margin:0 0 6px;font-size:13px;color:var(--azul)}
.box div{display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0}
.box .big{font-weight:800;font-size:15px;border-top:1px solid var(--borde);margin-top:4px;padding-top:5px}
.ahorro{background:#e8f5ec;border:1px solid #b9dfc6;color:var(--ok);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13.5px}
.cond{font-size:12.5px;color:#3b4557;margin-top:12px}
.cond ul{margin:4px 0 8px 18px;padding:0}
.hide{display:none}
.cfgrow6{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
@media(max-width:600px){.cfgrow6{grid-template-columns:1fr 1fr}}
#mini{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--azul);color:#fff;border-top:2px solid var(--dorado);padding:9px 14px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
#mini b{color:var(--dorado)}
@media(min-width:861px){#mini{display:none}}
@media(max-width:860px){body{padding-bottom:52px}}
@media print{
  header,.noprint,#form{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .grid{display:block}
  #cot{border:0;padding:0}
}
</style>
</head>
<body>
<header>
  <h1>Cotizador de servicios · Plano · Leads · Cobranza · Portal</h1>
  <nav class="noprint">
    <button data-act="tab" data-t="cot" class="on">Cotizar</button>
    <button data-act="tab" data-t="cfg">Precios</button>
  </nav>
</header>

<main>
  <!-- VISTA COTIZAR -->
  <section id="vCot">
    <div class="bar noprint">
      <button class="b" data-act="print">Imprimir / guardar PDF</button>
      <button class="b sec" data-act="copy">Copiar texto para WhatsApp</button>
    </div>
    <div class="grid">
      <div id="form"></div>
      <div id="cot"></div>
    </div>
  </section>

  <!-- VISTA PRECIOS -->
  <section id="vCfg" class="hide">
    <div class="bar">
      <button class="b" data-act="export">Exportar precios (respaldo)</button>
      <button class="b sec" data-act="import">Importar respaldo</button>
      <button class="b del" data-act="reset">Volver a precios iniciales</button>
      <input type="file" id="imp" accept=".json" class="hide">
    </div>
    <div class="hint" style="margin-bottom:12px">Los precios se guardan en <b>este navegador</b>. Usa <b>Exportar</b> para tener un respaldo y poder cargarlo en otra computadora o celular.</div>
    <div id="cfg"></div>
  </section>
</main>
<div id="mini" class="noprint"></div>

<script>
/* ============ PRECIOS INICIALES (puedes cambiarlos desde la pestaña "Precios") ============ */
const DEF = {
  marca: "Tu nombre o marca",
  contacto: "WhatsApp: 9XX XXX XXX",
  adelanto: 50,
  permanencia: 6,
  validez: 15,
  tc: 4,
  igv: 0,
  plano: [
    { id: "peq", nombre: "Pequeño", max: 150,   impl: 650,  mens: 80  },
    { id: "med", nombre: "Mediano", max: 600,   impl: 1300, mens: 100 },
    { id: "gra", nombre: "Grande",  max: 99999, impl: 2600, mens: 120 }
  ],
  leads: { impl: 700, tramos: [
    { nombre: "Hasta 20 asesores", mens: 100 },
    { nombre: "De 21 a 100 asesores", mens: 150 },
    { nombre: "Más de 100 asesores", mens: 200 }
  ]},
  cobranza: { impl: 1000, mens: 170 },
  portal:   { impl: 450,  mens: 65  },
  paq: { plus: { impl: 15, mens: 25 }, completo: { impl: 16, mens: 22 } },
  recargos: [
    { id: "r1", nombre: "Plano sin georreferenciar",            impl: 400, mens: 0 },
    { id: "r2", nombre: "Limpieza de lotes y fondo del plano",  impl: 300, mens: 0 },
    { id: "r3", nombre: "Cotizador con excepciones",            impl: 250, mens: 0 },
    { id: "r4", nombre: "Filtro por etapas",                    impl: 250, mens: 0 },
    { id: "r5", nombre: "Resort / áreas comunes en 3D",         impl: 300, mens: 0 }
  ],
  /* Fotos 360° con GPS: 1 día de trabajo cubre "haDia" hectáreas y "fotosDia" fotos.
     comida y alojamiento son valores de ejemplo: ajústalos en la pestaña Precios. */
  foto: { haDia: 3, fotosDia: 21, precioDia: 700, porHa: 250, resta: 50, comida: 60, alojamiento: 80, subida: 0, mens: 30,
    /* Recorrido: mientras más separados estén los puntos, menos fotos se toman por día */
    niveles: [
      { id: "n1", nombre: "Compacto (puntos cercanos)", fotosDia: 21, extra: 0  },
      { id: "n2", nombre: "Medio (puntos separados)",   fotosDia: 14, extra: 30 },
      { id: "n3", nombre: "Disperso (puntos lejanos)",  fotosDia: 8,  extra: 60 }
    ],
    paquetes: [
      { id: "f1", nombre: "360° Básico",   ha: 3,  fotos: 21, precio: 700,  mens: 30 },
      { id: "f2", nombre: "360° Medio",    ha: 6,  fotos: 42, precio: 1300, mens: 50 },
      { id: "f3", nombre: "360° Completo", ha: 12, fotos: 84, precio: 2500, mens: 80 }
    ] },
  incluye: "Hosting y publicación\nRespaldos\nSoporte por WhatsApp\nCambios menores (textos, precios, estados, usuarios)\nCorrección de fallos",
  noincluye: "Lotes o etapas nuevas\nOtro plano\nMódulos nuevos\nCapacitaciones adicionales"
};

/* ============ ESTADO ============ */
const KEY = "cotizador_servicios_v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.plano) return merge(s);
  } catch (e) {}
  return clone(DEF);
}
function merge(s) {
  const c = Object.assign(clone(DEF), s);
  c.foto = Object.assign(clone(DEF.foto), s.foto || {});
  return c;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }

let cfg = load();
let q = {
  cliente: "", proyecto: "", lotes: 300, tier: "med",
  serv: { plano: true, leads: true, cobranza: true, portal: false },
  leadsTramo: 1, rec: {}, custom: [],
  foto: { on: false, modo: "medida", nivel: "n1", fotos: 0, ha: 3, dias: 0, pasajes: 0, aloj: false, noches: 0, comida: true },
  descExtra: 0, descTipo: "%", descMens: 0, usd: false, aplicaPaquete: true, notas: ""
};

const fmt = n => {
  const v = q.usd ? n / (cfg.tc || 1) : n;
  return (q.usd ? "US$ " : "S/ ") + v.toLocaleString("es-PE", { minimumFractionDigits: q.usd ? 2 : 0, maximumFractionDigits: q.usd ? 2 : 0 });
};

/* ============ CÁLCULO ============ */
function calc() {
  const L = [];
  const t = cfg.plano.find(x => x.id === q.tier) || cfg.plano[0];
  if (q.serv.plano) L.push({ c: "Plano interactivo (" + t.nombre + ")", impl: t.impl, mens: t.mens, base: true });
  if (q.serv.leads) {
    const tr = cfg.leads.tramos[q.leadsTramo] || cfg.leads.tramos[0];
    L.push({ c: "Control de leads (" + tr.nombre + ")", impl: cfg.leads.impl, mens: tr.mens, base: true });
  }
  if (q.serv.cobranza) L.push({ c: "Sistema de cobranza", impl: cfg.cobranza.impl, mens: cfg.cobranza.mens, base: true });
  if (q.serv.portal) L.push({ c: "Portal de clientes", impl: cfg.portal.impl, mens: cfg.portal.mens, base: true });

  cfg.recargos.forEach(r => {
    const s = q.rec[r.id];
    if (s && s.on) {
      const n = Math.max(1, +s.qty || 1);
      L.push({ c: r.nombre + (n > 1 ? " ×" + n : ""), impl: r.impl * n, mens: r.mens * n });
    }
  });
  if (q.foto.on) {
    const F = cfg.foto;
    const pk = (F.paquetes || []).find(p => p.id === q.foto.modo);
    const nivs = F.niveles || [];
    const niv = nivs.find(n => n.id === q.foto.nivel) || nivs[0] || { nombre: "", fotosDia: F.fotosDia, extra: 0 };
    const nivBase = nivs[0] || niv;
    const ha = pk ? pk.ha : (+q.foto.ha || 0);
    const fotos = pk ? pk.fotos : (q.foto.fotos > 0 ? +q.foto.fotos : Math.round(ha * F.fotosDia / (F.haDia || 1)));
    const dias = q.foto.dias > 0 ? +q.foto.dias : Math.max(1, Math.ceil(fotos / (niv.fotosDia || 1)));
    const diasBase = Math.max(1, Math.ceil(fotos / (nivBase.fotosDia || 1)));
    const pl = n => n > 1 ? "s" : "";
    /* Precio base: hasta haDia hectáreas = precioDia; más grande = porHa × ha − resta (ej. 250×h − 50). Sin hectáreas: días × precioDia */
    const precioHa = ha > 0 ? (ha <= (+F.haDia || 3) ? +F.precioDia : Math.max(+F.precioDia, (+F.porHa || 0) * ha - (+F.resta || 0))) : dias * F.precioDia;
    L.push({
      c: (pk ? pk.nombre + " · " : "") + `Fotos 360° con GPS verificadas y ubicadas en el plano (${ha > 0 ? ha + " ha · " : ""}${fotos} fotos · ${dias} día${pl(dias)})`,
      impl: pk ? pk.precio : precioHa + fotos * (F.subida || 0),
      mens: pk ? pk.mens : (+F.mens || 0)
    });
    if (pk && dias > diasBase) L.push({ c: `Días adicionales por recorrido (${niv.nombre}) ×${dias - diasBase}`, impl: (dias - diasBase) * F.precioDia, mens: 0 });
    if (+niv.extra > 0) L.push({ c: `Movilidad interna en el terreno (${dias} día${pl(dias)})`, impl: dias * niv.extra, mens: 0 });
    if (+q.foto.pasajes) L.push({ c: "Viáticos: pasajes / movilidad", impl: +q.foto.pasajes, mens: 0 });
    if (q.foto.aloj) {
      const n = q.foto.noches > 0 ? +q.foto.noches : Math.max(dias - 1, 0);
      if (n > 0) L.push({ c: `Alojamiento (${n} noche${pl(n)})`, impl: n * F.alojamiento, mens: 0 });
    }
    if (q.foto.comida) L.push({ c: `Alimentación (${dias} día${pl(dias)})`, impl: dias * F.comida, mens: 0 });
  }
  q.custom.forEach(x => {
    if ((x.c || "").trim() || +x.impl || +x.mens) L.push({ c: x.c || "Otro concepto", impl: +x.impl || 0, mens: +x.mens || 0 });
  });

  const baseImpl = L.filter(x => x.base).reduce((a, x) => a + x.impl, 0);
  const baseMens = L.filter(x => x.base).reduce((a, x) => a + x.mens, 0);
  let pk = null;
  if (q.aplicaPaquete) {
    if (q.serv.plano && q.serv.leads && q.serv.cobranza && q.serv.portal) pk = { n: "Completo", p: cfg.paq.completo };
    else if (q.serv.plano && q.serv.leads && q.serv.cobranza) pk = { n: "Plus", p: cfg.paq.plus };
  }
  const subImpl = L.reduce((a, x) => a + x.impl, 0);
  const subMens = L.reduce((a, x) => a + x.mens, 0);
  const dPkImpl = pk ? baseImpl * pk.p.impl / 100 : 0;
  const dPkMens = pk ? baseMens * pk.p.mens / 100 : 0;
  const baseDesc = subImpl - dPkImpl;
  const dExtra = q.descTipo === "%" ? baseDesc * (+q.descExtra || 0) / 100 : Math.min(+q.descExtra || 0, baseDesc);
  const netImpl = subImpl - dPkImpl - dExtra;
  const dMens = (subMens - dPkMens) * (+q.descMens || 0) / 100;
  const netMens = subMens - dPkMens - dMens;
  const igv = +cfg.igv || 0;
  const iImpl = netImpl * igv / 100, iMens = netMens * igv / 100;
  const totImpl = netImpl + iImpl, totMens = netMens + iMens;
  const adel = totImpl * (+cfg.adelanto || 0) / 100;
  return { L, pk, subImpl, subMens, dPkImpl, dPkMens, dExtra, dMens, iImpl, iMens, totImpl, totMens, adel, igv };
}

/* ============ COTIZACIÓN (vista previa e impresión) ============ */
function renderQuote() {
  const r = calc();
  const hoy = new Date().toLocaleDateString("es-PE");
  const filas = r.L.length ? r.L.map(x => `<tr><td>${esc(x.c)}</td><td class="r">${x.impl ? fmt(x.impl) : "—"}</td><td class="r">${x.mens ? fmt(x.mens) : "—"}</td></tr>`).join("")
    : `<tr><td colspan="3"><small>Elige al menos un servicio.</small></td></tr>`;
  const ahorroImpl = r.dPkImpl + r.dExtra;
  const ahorroMens = r.dPkMens + r.dMens;
  const ahorroTxt = (ahorroImpl > 0 || ahorroMens > 0)
    ? `<div class="ahorro">Ahorro para el cliente: <b>${fmt(ahorroImpl)}</b> en la implementación${ahorroMens > 0 ? ` y <b>${fmt(ahorroMens)}</b> al mes` : ""}.</div>` : "";
  const li = t => String(t || "").split("\n").filter(x => x.trim()).map(x => `<li>${esc(x)}</li>`).join("");
  $("#cot").innerHTML = `
    <div class="top">
      <div><h2>Propuesta de servicios</h2><small>${esc(cfg.marca)} · ${esc(cfg.contacto)}</small></div>
      <div style="text-align:right"><small>Fecha: ${hoy}<br>Válida por ${esc(cfg.validez)} días</small></div>
    </div>
    <div style="margin-bottom:10px"><b>Cliente:</b> ${esc(q.cliente) || "—"}<br><b>Proyecto:</b> ${esc(q.proyecto) || "—"} ${q.serv.plano ? "· " + esc(q.lotes) + " lotes" : ""}</div>
    <table>
      <tr><th>Concepto</th><th class="r">Implementación (pago único)</th><th class="r">Mensual</th></tr>
      ${filas}
    </table>
    <div class="sum">
      <div class="box"><h4>IMPLEMENTACIÓN</h4>
        <div><span>Subtotal</span><span>${fmt(r.subImpl)}</span></div>
        ${r.dPkImpl > 0 ? `<div class="neg"><span>Descuento paquete ${r.pk.n} (${r.pk.p.impl}%)</span><span>− ${fmt(r.dPkImpl)}</span></div>` : ""}
        ${r.dExtra > 0 ? `<div class="neg"><span>Descuento comercial${q.descTipo === "%" ? " (" + q.descExtra + "%)" : ""}</span><span>− ${fmt(r.dExtra)}</span></div>` : ""}
        ${r.igv > 0 ? `<div><span>IGV (${r.igv}%)</span><span>${fmt(r.iImpl)}</span></div>` : ""}
        <div class="big"><span>TOTAL</span><span>${fmt(r.totImpl)}</span></div>
        <div><span>Adelanto (${cfg.adelanto}%)</span><span>${fmt(r.adel)}</span></div>
        <div><span>Saldo a la entrega</span><span>${fmt(r.totImpl - r.adel)}</span></div>
      </div>
      <div class="box"><h4>MENSUALIDAD</h4>
        <div><span>Subtotal</span><span>${fmt(r.subMens)}</span></div>
        ${r.dPkMens > 0 ? `<div class="neg"><span>Descuento paquete ${r.pk.n} (${r.pk.p.mens}%)</span><span>− ${fmt(r.dPkMens)}</span></div>` : ""}
        ${r.dMens > 0 ? `<div class="neg"><span>Descuento comercial (${q.descMens}%)</span><span>− ${fmt(r.dMens)}</span></div>` : ""}
        ${r.igv > 0 ? `<div><span>IGV (${r.igv}%)</span><span>${fmt(r.iMens)}</span></div>` : ""}
        <div class="big"><span>TOTAL / MES</span><span>${fmt(r.totMens)}</span></div>
        <div><small>Permanencia mínima: ${cfg.permanencia} meses</small></div>
      </div>
    </div>
    ${ahorroTxt}
    <div class="cond">
      <b>La mensualidad incluye:</b><ul>${li(cfg.incluye)}</ul>
      <b>No incluye (se cotiza aparte):</b><ul>${li(cfg.noincluye)}</ul>
      ${q.notas.trim() ? `<b>Notas:</b><br>${esc(q.notas).replace(/\n/g, "<br>")}` : ""}
    </div>`;
  $("#mini").innerHTML = `<span>Implementación: <b>${fmt(r.totImpl)}</b></span><span>Mensual: <b>${fmt(r.totMens)}</b></span>`;
}

/* ============ FORMULARIO DE COTIZAR ============ */
function renderForm() {
  const tiers = cfg.plano.map(t => `<option value="${esc(t.id)}" ${q.tier === t.id ? "selected" : ""}>${esc(t.nombre)} (hasta ${t.max >= 99999 ? "más" : t.max} lotes)</option>`).join("");
  const tramos = cfg.leads.tramos.map((t, i) => `<option value="${i}" ${q.leadsTramo === i ? "selected" : ""}>${esc(t.nombre)}</option>`).join("");
  const recs = cfg.recargos.map(r => {
    const s = q.rec[r.id] || { on: false, qty: 1 };
    return `<div class="rec"><label class="chk"><input type="checkbox" data-rec="${esc(r.id)}" data-k="on" ${s.on ? "checked" : ""}>${esc(r.nombre)} <small>(${fmt(r.impl)})</small></label><input class="qty" type="number" min="1" data-rec="${esc(r.id)}" data-k="qty" value="${s.qty || 1}" title="Cantidad"></div>`;
  }).join("");
  const pkOpts = `<option value="medida" ${q.foto.modo === "medida" ? "selected" : ""}>A medida (por hectáreas)</option>` +
    (cfg.foto.paquetes || []).map(p => `<option value="${esc(p.id)}" ${q.foto.modo === p.id ? "selected" : ""}>${esc(p.nombre)} · ${p.ha} ha · ${p.fotos} fotos · ${fmt(p.precio)}</option>`).join("");
  const enPaquete = (cfg.foto.paquetes || []).some(p => p.id === q.foto.modo);
  const nivOpts = (cfg.foto.niveles || []).map(n => `<option value="${esc(n.id)}" ${q.foto.nivel === n.id ? "selected" : ""}>${esc(n.nombre)} · ${n.fotosDia} fotos/día</option>`).join("");
  $("#form").innerHTML = `
    <div class="card"><h3>1 · Cliente y proyecto</h3>
      <div class="row">
        <label>Cliente / empresa<input data-q="cliente" value="${esc(q.cliente)}"></label>
        <label>Proyecto<input data-q="proyecto" value="${esc(q.proyecto)}"></label>
        <label>N° de lotes<input type="number" data-q="lotes" data-num="1" value="${q.lotes}"></label>
        <label>Tamaño del plano<select data-q="tier">${tiers}</select></label>
      </div>
    </div>
    <div class="card"><h3>2 · Servicios</h3>
      <label class="chk"><input type="checkbox" data-s="plano" ${q.serv.plano ? "checked" : ""}>Plano interactivo</label>
      <label class="chk"><input type="checkbox" data-s="leads" ${q.serv.leads ? "checked" : ""}>Control de leads</label>
      <label class="chk"><input type="checkbox" data-s="cobranza" ${q.serv.cobranza ? "checked" : ""}>Cobranza</label>
      <label class="chk"><input type="checkbox" data-s="portal" ${q.serv.portal ? "checked" : ""}>Portal de clientes</label>
      <div style="margin-top:8px"><label>Cantidad de asesores (para Leads)<select data-q="leadsTramo" data-num="1">${tramos}</select></label></div>
      <div class="hint">Plano + Leads + Cobranza = paquete <b>Plus</b>. Agregando Portal = paquete <b>Completo</b>. El descuento se aplica solo.</div>
    </div>
    <div class="card"><h3>3 · Trabajos según dificultad del plano</h3>${recs || "<small>No hay recargos. Agrégalos en Precios.</small>"}</div>
    <div class="card"><h3>3b · Fotos 360° con GPS (por hectáreas)</h3>
      <label class="chk"><input type="checkbox" data-ft="on" ${q.foto.on ? "checked" : ""}>Incluir toma de fotos 360°</label>
      <label style="margin-top:8px">Paquete o a medida<select data-ft="modo">${pkOpts}</select></label>
      <label style="margin-top:8px">Recorrido entre los puntos de foto<select data-ft="nivel">${nivOpts}</select></label>
      <div class="row" style="margin-top:8px">
        <label>Hectáreas del proyecto${enPaquete ? " (las fija el paquete)" : ""}<input type="number" min="0" step="any" data-ft="ha" data-num="1" value="${q.foto.ha}" ${enPaquete ? "disabled" : ""}></label>
        <label>Fotos que pide el cliente (0 = según hectáreas)<input type="number" min="0" data-ft="fotos" data-num="1" value="${q.foto.fotos}" ${enPaquete ? "disabled" : ""}></label>
        <label>Días de trabajo (0 = automático)<input type="number" min="0" data-ft="dias" data-num="1" value="${q.foto.dias}"></label>
        <label>Pasajes / movilidad (S/)<input type="number" min="0" data-ft="pasajes" data-num="1" value="${q.foto.pasajes}"></label>
        <label>Noches de alojamiento (0 = automático)<input type="number" min="0" data-ft="noches" data-num="1" value="${q.foto.noches}"></label>
      </div>
      <label class="chk" style="margin-top:8px"><input type="checkbox" data-ft="aloj" ${q.foto.aloj ? "checked" : ""}>Cobrar alojamiento</label>
      <label class="chk"><input type="checkbox" data-ft="comida" ${q.foto.comida ? "checked" : ""}>Cobrar alimentación</label>
      <div class="hint">Hasta ${cfg.foto.haDia} ha = S/ ${cfg.foto.precioDia}. Más de ${cfg.foto.haDia} ha = ${cfg.foto.porHa} × ha − ${cfg.foto.resta}. Si el cliente pide pocas fotos en un terreno grande, escribe cuántas y elige el recorrido: los días se calculan según la distancia entre puntos.</div>
    </div>
    <div class="card"><h3>4 · Otros conceptos (a pedido del cliente)</h3><div id="cust"></div>
      <button class="b sec" data-act="addcu">+ Agregar concepto</button></div>
    <div class="card"><h3>5 · Ajustes</h3>
      <div class="row">
        <label>Descuento en implementación<input type="number" min="0" data-q="descExtra" data-num="1" value="${q.descExtra}"></label>
        <label>Tipo de descuento<select data-q="descTipo"><option value="%" ${q.descTipo === "%" ? "selected" : ""}>Porcentaje (%)</option><option value="S/" ${q.descTipo === "S/" ? "selected" : ""}>Monto (S/)</option></select></label>
        <label>Descuento en mensualidad (%)<input type="number" min="0" max="100" data-q="descMens" data-num="1" value="${q.descMens}"></label>
      </div>
      <label class="chk" style="margin-top:8px"><input type="checkbox" data-q="aplicaPaquete" ${q.aplicaPaquete ? "checked" : ""}>Aplicar descuento de paquete</label>
      <label class="chk"><input type="checkbox" data-q="usd" ${q.usd ? "checked" : ""}>Mostrar en dólares (T.C. ${cfg.tc})</label>
      <label style="margin-top:8px">Notas para el cliente<textarea data-q="notas">${esc(q.notas)}</textarea></label>
    </div>`;
  renderCust();
}
function renderCust() {
  $("#cust").innerHTML = q.custom.map((x, i) => `
    <div class="cu">
      <input placeholder="Concepto" data-cu="${i}" data-f="c" value="${esc(x.c)}">
      <input type="number" placeholder="Implementación" data-cu="${i}" data-f="impl" value="${x.impl || ""}">
      <input type="number" placeholder="Mensual" data-cu="${i}" data-f="mens" value="${x.mens || ""}">
      <button class="b del" data-act="delcu" data-i="${i}">✕</button>
    </div>`).join("");
}
function autoTier() {
  const s = [...cfg.plano].sort((a, b) => a.max - b.max);
  const t = s.find(x => q.lotes <= x.max) || s[s.length - 1];
  q.tier = t.id;
  const el = document.querySelector("[data-q=tier]");
  if (el) el.value = t.id;
}

/* ============ PANTALLA DE PRECIOS ============ */
const getP = p => p.split(".").reduce((o, k) => o[k], cfg);
function setP(p, v) {
  const k = p.split(".");
  let o = cfg;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length - 1]] = v;
}
const f = (label, p, type = "number") => `<label>${label}<input data-p="${p}" type="${type}" step="any" value="${esc(getP(p))}"></label>`;
const cell = (p, type = "number", ph = "") => `<input data-p="${p}" type="${type}" step="any" placeholder="${ph}" value="${esc(getP(p))}">`;

function renderConfig() {
  let h = `
  <div class="card"><h3>General</h3><div class="row">
    ${f("Tu nombre / marca", "marca", "text")}${f("Contacto", "contacto", "text")}
    ${f("Adelanto %", "adelanto")}${f("Permanencia mínima (meses)", "permanencia")}
    ${f("Validez de la propuesta (días)", "validez")}${f("Tipo de cambio (S/ por US$)", "tc")}
    ${f("IGV % (0 si no aplica)", "igv")}
  </div></div>

  <div class="card"><h3>Plano interactivo (por tamaño)</h3>
    <div class="cfgrow"><small>Nombre</small><small>Hasta N° lotes</small><small>Implementación</small><small>Mensual</small><span></span></div>
    ${cfg.plano.map((t, i) => `<div class="cfgrow">${cell(`plano.${i}.nombre`, "text")}${cell(`plano.${i}.max`)}${cell(`plano.${i}.impl`)}${cell(`plano.${i}.mens`)}<span></span></div>`).join("")}
    <small>El último tamaño debe tener un número alto (ej. 99999) para cubrir los planos más grandes.</small>
  </div>

  <div class="card"><h3>Control de leads</h3>
    <div class="row">${f("Implementación", "leads.impl")}</div>
    <div class="cfgrow" style="margin-top:8px"><small>Tramo de asesores</small><small>Mensual</small><span></span><span></span><span></span></div>
    ${cfg.leads.tramos.map((t, i) => `<div class="cfgrow">${cell(`leads.tramos.${i}.nombre`, "text")}${cell(`leads.tramos.${i}.mens`)}<span></span><span></span><span></span></div>`).join("")}
  </div>

  <div class="card"><h3>Cobranza y Portal</h3><div class="row">
    ${f("Cobranza · implementación", "cobranza.impl")}${f("Cobranza · mensual", "cobranza.mens")}
    ${f("Portal · implementación", "portal.impl")}${f("Portal · mensual", "portal.mens")}
  </div></div>

  <div class="card"><h3>Descuento por paquete (%)</h3><div class="row">
    ${f("Plus · implementación %", "paq.plus.impl")}${f("Plus · mensual %", "paq.plus.mens")}
    ${f("Completo · implementación %", "paq.completo.impl")}${f("Completo · mensual %", "paq.completo.mens")}
  </div></div>

  <div class="card"><h3>Fotos 360° con GPS</h3><div class="row">
    ${f("Hectáreas por día (solo para estimar fotos si el cliente no dice cuántas)", "foto.haDia")}${f("Fotos por hectárea-día base (fotos que caben en esas hectáreas)", "foto.fotosDia")}
    ${f("Precio hasta las hectáreas por día (S/)", "foto.precioDia")}${f("Terreno grande: precio por hectárea (S/)", "foto.porHa")}${f("Terreno grande: descuento fijo (S/)", "foto.resta")}${f("Alimentación por día (S/)", "foto.comida")}
    ${f("Alojamiento por noche (S/)", "foto.alojamiento")}${f("Subida al plano por foto (S/, 0 si va incluida)", "foto.subida")}
    ${f("Mantenimiento mensual 360° a medida (S/)", "foto.mens")}
  </div>
  <h3 style="margin-top:14px">Recorrido entre puntos (a más distancia, menos fotos por día)</h3>
  <div class="cfgrow"><small>Nivel</small><small>Fotos por día</small><small>Movilidad interna por día (S/)</small><span></span><span></span></div>
  ${cfg.foto.niveles.map((n, i) => `<div class="cfgrow">${cell(`foto.niveles.${i}.nombre`, "text")}${cell(`foto.niveles.${i}.fotosDia`)}${cell(`foto.niveles.${i}.extra`)}<span></span><span></span></div>`).join("")}
  <small>Los días de trabajo = fotos pedidas ÷ fotos por día del nivel elegido. La movilidad interna cubre moto, mototaxi o camioneta dentro del terreno.</small>
  <h3 style="margin-top:14px">Paquetes de fotos 360°</h3>
  <div class="cfgrow6"><small>Nombre</small><small>Hectáreas</small><small>Fotos</small><small>Precio</small><small>Mensual</small><span></span></div>
  ${cfg.foto.paquetes.map((p, i) => `<div class="cfgrow6">${cell(`foto.paquetes.${i}.nombre`, "text")}${cell(`foto.paquetes.${i}.ha`)}${cell(`foto.paquetes.${i}.fotos`)}${cell(`foto.paquetes.${i}.precio`)}${cell(`foto.paquetes.${i}.mens`)}<button class="b del" data-act="delpk" data-i="${i}">✕</button></div>`).join("")}
  <button class="b sec" data-act="addpk">+ Agregar paquete</button>
  <div class="hint">El precio del paquete no incluye viáticos (pasajes, alojamiento, alimentación): esos se suman aparte en cada cotización.</div>
  </div>

  <div class="card"><h3>Trabajos adicionales / recargos por dificultad</h3>
    <div class="cfgrow"><small>Concepto</small><small>Implementación</small><small>Mensual</small><span></span><span></span></div>
    ${cfg.recargos.map((r, i) => `<div class="cfgrow">${cell(`recargos.${i}.nombre`, "text")}${cell(`recargos.${i}.impl`)}${cell(`recargos.${i}.mens`)}<button class="b del" data-act="delrec" data-i="${i}">✕</button><span></span></div>`).join("")}
    <button class="b sec" data-act="addrec">+ Agregar recargo</button>
  </div>

  <div class="card"><h3>Textos de la propuesta (un punto por línea)</h3>
    <label>La mensualidad incluye<textarea data-p="incluye" data-ta="1">${esc(cfg.incluye)}</textarea></label>
    <label style="margin-top:8px">No incluye<textarea data-p="noincluye" data-ta="1">${esc(cfg.noincluye)}</textarea></label>
  </div>`;
  $("#cfg").innerHTML = h;
}

/* ============ EVENTOS ============ */
function onField(e) {
  const t = e.target;
  if (t.dataset.q) {
    const k = t.dataset.q;
    q[k] = t.type === "checkbox" ? t.checked : (t.dataset.num ? +t.value : t.value);
    if (k === "lotes") autoTier();
    if (k === "usd") renderForm();
    renderQuote();
  } else if (t.dataset.s) {
    q.serv[t.dataset.s] = t.checked;
    renderQuote();
  } else if (t.dataset.rec) {
    const id = t.dataset.rec;
    q.rec[id] = q.rec[id] || { on: false, qty: 1 };
    if (t.dataset.k === "on") q.rec[id].on = t.checked; else q.rec[id].qty = +t.value || 1;
    renderQuote();
  } else if (t.dataset.ft) {
    const k = t.dataset.ft;
    q.foto[k] = t.type === "checkbox" ? t.checked : ((k === "modo" || k === "nivel") ? t.value : (+t.value || 0));
    if (k === "modo") renderForm();
    renderQuote();
  } else if (t.dataset.cu !== undefined) {
    q.custom[+t.dataset.cu][t.dataset.f] = t.dataset.f === "c" ? t.value : (+t.value || 0);
    renderQuote();
  }
}
document.addEventListener("input", onField);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.p) {
    const isNum = t.type === "number";
    setP(t.dataset.p, isNum ? (parseFloat(t.value) || 0) : t.value);
    save(); renderForm(); renderQuote();
  } else if (t.id === "imp") {
    const file = t.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d.plano) throw 0;
        cfg = merge(d); save();
        renderConfig(); renderForm(); renderQuote();
        alert("Precios importados.");
      } catch (x) { alert("Ese archivo no es un respaldo válido."); }
    };
    rd.readAsText(file); t.value = "";
  } else onField(e);
});

function textoWA() {
  const r = calc();
  let s = `*Propuesta de servicios*\nCliente: ${q.cliente || "—"}\nProyecto: ${q.proyecto || "—"}\n\n`;
  r.L.forEach(x => { s += `• ${x.c}: ${x.impl ? fmt(x.impl) : "—"}${x.mens ? " + " + fmt(x.mens) + "/mes" : ""}\n`; });
  if (r.dPkImpl > 0) s += `\nDescuento paquete ${r.pk.n}: -${fmt(r.dPkImpl)}`;
  if (r.dExtra > 0) s += `\nDescuento comercial: -${fmt(r.dExtra)}`;
  s += `\n*Implementación: ${fmt(r.totImpl)}* (adelanto ${cfg.adelanto}%: ${fmt(r.adel)})`;
  s += `\n*Mensualidad: ${fmt(r.totMens)}* (mínimo ${cfg.permanencia} meses)`;
  s += `\n\nVálida por ${cfg.validez} días.\n${cfg.marca} · ${cfg.contacto}`;
  return s;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "tab") {
    const cot = b.dataset.t === "cot";
    $("#vCot").classList.toggle("hide", !cot);
    $("#vCfg").classList.toggle("hide", cot);
    $("#mini").classList.toggle("hide", !cot);
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
    if (cot) { renderForm(); renderQuote(); }
  } else if (a === "print") window.print();
  else if (a === "copy") {
    const t = textoWA();
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert("Texto copiado. Pégalo en WhatsApp."))
      .catch(() => { prompt("Copia este texto:", t); });
  } else if (a === "addcu") { q.custom.push({ c: "", impl: 0, mens: 0 }); renderCust(); }
  else if (a === "delcu") { q.custom.splice(+b.dataset.i, 1); renderCust(); renderQuote(); }
  else if (a === "addrec") { cfg.recargos.push({ id: "r" + Date.now(), nombre: "Nuevo concepto", impl: 0, mens: 0 }); save(); renderConfig(); }
  else if (a === "addpk") { cfg.foto.paquetes.push({ id: "f" + Date.now(), nombre: "Nuevo paquete", ha: 0, fotos: 0, precio: 0, mens: 0 }); save(); renderConfig(); }
  else if (a === "delpk") {
    if (confirm("¿Quitar este paquete?")) { const p = cfg.foto.paquetes.splice(+b.dataset.i, 1)[0]; if (p && q.foto.modo === p.id) q.foto.modo = "medida"; save(); renderConfig(); }
  } else if (a === "delrec") {
    if (confirm("¿Quitar este recargo?")) { cfg.recargos.splice(+b.dataset.i, 1); save(); renderConfig(); }
  } else if (a === "export") {
    const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: "application/json" });
    const l = document.createElement("a");
    l.href = URL.createObjectURL(blob);
    l.download = "precios_cotizador_" + new Date().toISOString().slice(0, 10) + ".json";
    l.click(); URL.revokeObjectURL(l.href);
  } else if (a === "import") $("#imp").click();
  else if (a === "reset") {
    if (confirm("¿Volver a los precios iniciales? Se perderán los cambios (exporta antes si quieres respaldo).")) {
      cfg = clone(DEF); save(); renderConfig(); renderForm(); renderQuote();
    }
  }
});

/* ============ INICIO ============ */
autoTier();
renderConfig();
renderForm();
renderQuote();
</script>
</body>
</html>
